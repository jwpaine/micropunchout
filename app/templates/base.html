<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Punchout{% endblock %}</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #6b7280; --card: #fff; --border: #dde1e7; --accent: #2457d6; --error: #b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171c; --fg: #e6e8eb; --muted: #9aa3af; --card: #1d2128; --border: #2f3540; --accent: #6b93f5; --error: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
    header .brand { font-weight: 600; }
    header form { display: flex; gap: 12px; align-items: center; margin: 0; }
    main { margin: 32px 0; padding: 0 32px; }
    @media (max-width: 700px) { main { margin: 20px 0; padding: 0 16px; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .card.narrow { max-width: 360px; margin: 0 auto; }
    label { display: block; margin: 12px 0 4px; font-weight: 500; }
    input[type=text], input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
    button { margin-top: 16px; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    header button { margin: 0; background: transparent; color: var(--accent); border: 1px solid var(--border); }
    .muted { color: var(--muted); }
    .error { color: var(--error); margin: 8px 0 0; }
    header nav { display: flex; gap: 16px; margin-left: 24px; margin-right: auto; }
    a { color: var(--accent); }
    header nav a { text-decoration: none; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .button { display: inline-block; padding: 8px 14px; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { font-weight: 500; color: var(--muted); font-size: 13px; }
    code { font: 13px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; word-break: break-all; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; margin: 16px 0 0; }
    dt { color: var(--muted); }
    dd { margin: 0; min-width: 0; }
    .notice { border: 1px solid var(--accent); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .notice code { display: inline-block; font-size: 15px; margin: 8px 8px 0 0; }
    .notice button { margin-top: 8px; padding: 4px 10px; }
    .search { display: flex; gap: 8px; margin-top: 16px; }
    .search input { flex: 1; }
    .search button { margin: 0; }
    .table-wrap { overflow-x: auto; }
    .num { text-align: right; white-space: nowrap; }
    .small { font-size: 13px; }
    tr.inactive td { color: var(--muted); }
    .pager { margin-top: 12px; }
    .pager a { margin: 0 8px; }
    .error-box { border-color: var(--error); }
    .error-box ul { margin: 8px 0 0; padding-left: 20px; }
    label.check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    input[type=file] { font: inherit; }
    @media (max-width: 520px) { dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 10px; } }
    pre { font: 12px/1.45 ui-monospace, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; max-height: 480px; }
    h2 { font-size: 17px; margin: 28px 0 4px; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .badge.ok { border-color: var(--accent); color: var(--accent); }
    form.inline { display: inline; }
    form.inline button { margin: 0; padding: 2px 10px; font-size: 13px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0; }
    .tabs a { padding: 8px 14px; text-decoration: none; color: var(--muted); border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; margin-bottom: -1px; }
    .tabs a[aria-current="page"] { color: var(--fg); background: var(--card); border-color: var(--border); font-weight: 500; }
    details summary { cursor: pointer; margin-top: 20px; }
    textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, monospace; resize: vertical; }
    select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
    input[type=number] { width: 80px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
    .products { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
    .product { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
    .product img, .product .noimg { width: 64px; height: 64px; object-fit: contain; border-radius: 6px; background: var(--bg); }
    .product .price { font-weight: 600; }
    .product form { display: flex; gap: 6px; align-items: center; }
    .product form button { margin: 0; }
    @media (max-width: 560px) { .product { grid-template-columns: 48px 1fr; } .product img, .product .noimg { width: 48px; height: 48px; } .product form { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header>
    {% block header %}
    <span class="brand">Punchout</span>
    {% if user %}
    <nav>
      <a href="/">Home</a>
      {% if "admin" in user.roles %}<a href="/admin/vendors">Vendors</a>{% endif %}
    </nav>
    <form method="post" action="/logout">
      <span class="muted">{{ user.display_name }}</span>
      <button type="submit">Log out</button>
    </form>
    {% endif %}
    {% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
