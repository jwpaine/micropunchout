{% extends "base.html" %}
{% block header %}
<a class="brand" href="{{ base }}" style="text-decoration: none; color: inherit">{{ vendor_name }}</a>
<nav>
  <a href="{{ base }}">Catalog</a>
  <a href="{{ base }}/cart">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a>
</nav>
<span class="muted small">{{ session.user_name or session.user_email }}{% if session.read_only %} · view only{% endif %}</span>
{% endblock %}
